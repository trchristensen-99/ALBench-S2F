# EvoAug with Peter's specified parameter settings:
# - insertions/deletions: ~30nt average
# - mutations: ~5%
# - translocations: ~100bp window (half gets cut = ~50bp blocks)
# - 1-3 perturbations per sequence, uniformly distributed
_target_: albench.reservoir.evoaug_structural.EvoAugStructuralSampler
seed: ${seed}
p_deletion: 0.3
p_insertion: 0.3
p_inversion: 0.2
p_translocation: 0.25
p_tandem_dup: 0.1
p_point_mutation: 0.3
max_indel_size: 30
max_inversion_size: 40
max_translocation_size: 50
max_dup_size: 20
point_mutation_rate: 0.05
min_events: 1
max_events: 3
