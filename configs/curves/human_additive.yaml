# Additive scaling curves for the human arm.
#
# A curve point is: a FIXED genomic baseline, plus N sequences from one reservoir.
# Only N varies along a curve, so the slope is attributable to the reservoir rather
# than to anything about the baseline.
#
# baseline 0 is the from-scratch curve (reservoir data only).
# 300k baseline is deliberately deferred; genomic CREs do not scale much past ~618k
# raw, so the 300k-baseline arm cannot be extended the way the others can.

baselines: [0, 3000, 30000]
increments: [10000, 30000, 100000, 300000]

# At the 30k baseline the genomic arm can supply only 284,981 further real CREs, so a
# +300k point exists for the synthetic arms and not for it. Comparing a 300k synthetic
# point against a 285k genomic one would confound "more data" with "different data",
# so at this baseline EVERY arm is capped to the genomic ceiling and the comparison is
# like-for-like. The uncapped +300k points at baselines 0 and 3k are kept: there the
# question is how far each arm scales, not how they compare at a matched budget.
matched_top_increment:
  30000: 284981

# One generated+labelled 300k pool per reservoir serves EVERY point on its curve:
# the increments are nested prefixes of a single permutation, so 10k is a strict
# subset of 30k is a strict subset of 100k is a strict subset of 300k. Extra
# subset-order replicates cost nothing further -- they are just another permutation
# seed over the same labelled pool, which is why pool_size is fixed at the largest
# increment rather than per point.
pool_size: 300000
pool_seed: 0
subset_seeds: [0, 1]        # subset ORDER replicates; free, no extra labelling

baseline_pool: genomic       # the fixed baseline is drawn from the genomic reservoir
baseline_seed: 7             # distinct from pool_seed so baseline != added genomic data

reservoirs:
  - genomic                  # the reference arm: more of the same real CREs
  - random                   # floor
  - motif_shared_core        # screen winner at D=30k
  - motif_ct_enriched
  - motif_syntax_core
  - mutagenesis
  - zoonomia
  # TUNED arm. Without an explicit parameter this falls back to the sampler defaults,
  # which are exactly evoaug_ours_default -- the two pools came out byte-for-byte
  # identical, wasting a labelling pass and putting two indistinguishable lines on the
  # plot. p_deletion=0.5 is the screen's best evoaug cell (in_dist 0.8218 vs 0.8191 for
  # the default), so "tuned" now means something.
  - name: evoaug
    params: {p_deletion: 0.5}
    alias: evoaug
  - evoaug_ours_default      # untuned, our defaults
  - evoaug_paper2023         # published control (Lee, Yu & Koo 2023)

  # Perturbing Zoonomia ortholog CREs instead of the Gosai pool. A resample-only arm
  # is capped at the 314,981 real CREs that exist; an arm that PERTURBS a base can
  # emit many distinct descendants per starting sequence, so these are the versions
  # that can be scaled past the ceiling the genomic arm hits.
  - name: mutagenesis
    params: {base: zoonomia}
    alias: mutagenesis_zoonomia
  - name: evoaug
    params: {base: zoonomia, p_deletion: 0.5}
    alias: evoaug_zoonomia
